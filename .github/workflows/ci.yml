name: ci
on:
  pull_request:
    # Docs-only changes can't break the build or a release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test
        run: task test
      - name: Lint
        run: task lint
      - name: Build
        run: task build

  release-dry:
    # Signs with the real certificate, so only for branches of this repository: forks get no
    # secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: scripts/ci-keychain.sh import
      - name: Dry-run the release
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: task release DRY=1
      - name: Delete the keychain
        if: always()
        run: scripts/ci-keychain.sh delete
