name: Set up the tools
description: >
  Task, SwiftLint, ShellCheck, actionlint and git-cliff, plus OpenSSL 3 and Sparkle's tools on
  PATH. Swift comes from the runner's Xcode, gh is preinstalled. CI skips Nix: the dev shell is a
  1.9 GiB download, and these are the only tools the runner lacks. Renovate updates the versions
  marked with `# renovate:`; the dev shell's come from flake.lock and may be a little apart.
runs:
  using: composite
  steps:
    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
        version: 3.53.1
        repo-token: ${{ github.token }}
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        # renovate: datasource=github-releases depName=orhun/git-cliff extractVersion=^v(?<version>.+)$
        tool: git-cliff@2.14.2
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
        tool: shellcheck@0.11.0
    - name: Install SwiftLint and actionlint, put OpenSSL 3 and Sparkle's tools on PATH
      shell: bash
      run: |
        set -euo pipefail
        # A version bump needs its sha256 updated by hand, see renovate.json.
        # renovate: datasource=github-releases depName=realm/SwiftLint
        swiftlint=0.65.1
        swiftlint_sha256=c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
        actionlint=1.7.12
        actionlint_sha256=aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
        bin=$RUNNER_TEMP/bin
        mkdir -p "$bin"
        cd "$RUNNER_TEMP"
        curl -fsSL -o swiftlint.zip \
          "https://github.com/realm/SwiftLint/releases/download/$swiftlint/portable_swiftlint.zip"
        echo "$swiftlint_sha256  swiftlint.zip" |
          shasum -a 256 -c -
        unzip -q -o swiftlint.zip swiftlint -d "$bin"
        curl -fsSL -o actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v$actionlint/actionlint_${actionlint}_darwin_arm64.tar.gz"
        echo "$actionlint_sha256  actionlint.tar.gz" |
          shasum -a 256 -c -
        tar -xzf actionlint.tar.gz -C "$bin" actionlint
        # /usr/bin/openssl is LibreSSL, which lacks the -rawin the appcast check needs.
        openssl=$(brew --prefix openssl@3)/bin
        "$openssl/openssl" version
        {
          echo "$bin"
          echo "$openssl"
          # SwiftPM downloads Sparkle with sign_update; the path exists once the package resolves.
          echo "$GITHUB_WORKSPACE/.build/artifacts/sparkle/Sparkle/bin"
        } >>"$GITHUB_PATH"
