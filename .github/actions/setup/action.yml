name: Set up the tools
description: >
  Task, SwiftLint, ShellCheck, actionlint and git-cliff at the versions of flake.lock, plus
  OpenSSL 3 and Sparkle's tools on PATH. Swift comes from the runner's Xcode, gh is preinstalled.
  CI skips Nix: the dev shell is a 1.9 GiB download, and these are the only tools the runner lacks.
  Keep the versions equal to `nix develop -c <tool> --version`.
runs:
  using: composite
  steps:
    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.53.1
        repo-token: ${{ github.token }}
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: git-cliff@2.14.2,shellcheck@0.11.0
    - name: Install SwiftLint and actionlint, put OpenSSL 3 and Sparkle's tools on PATH
      shell: bash
      run: |
        set -euo pipefail
        bin=$RUNNER_TEMP/bin
        mkdir -p "$bin"
        cd "$RUNNER_TEMP"
        curl -fsSL -o swiftlint.zip \
          https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
        echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip" |
          shasum -a 256 -c -
        unzip -q -o swiftlint.zip swiftlint -d "$bin"
        curl -fsSL -o actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz
        echo "aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f  actionlint.tar.gz" |
          shasum -a 256 -c -
        tar -xzf actionlint.tar.gz -C "$bin" actionlint
        # /usr/bin/openssl is LibreSSL, which lacks the -rawin the appcast check needs.
        openssl=$(brew --prefix openssl@3)/bin
        "$openssl/openssl" version
        {
          echo "$bin"
          echo "$openssl"
          # SwiftPM downloads Sparkle with sign_update; the path exists once the package resolves.
          echo "$GITHUB_WORKSPACE/.build/artifacts/sparkle/Sparkle/bin"
        } >>"$GITHUB_PATH"
