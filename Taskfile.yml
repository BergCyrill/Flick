version: "3"

vars:
  APP: build/Flick.app
  # `task release` passes the real version; local builds are "<last tag>-dev".
  VERSION:
    sh: tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0); echo "${tag#v}-dev"
  BUILD:
    sh: git rev-list --count HEAD 2>/dev/null || echo 0

tasks:
  test:
    desc: Run the unit tests
    cmds:
      - swift test

  lint:
    desc: Run swiftlint, swift-format (strict), shellcheck and actionlint
    cmds:
      - swiftlint lint --strict --quiet
      - swift format lint --strict --recursive Sources Tests Package.swift
      - shellcheck scripts/*.sh
      - actionlint

  format:
    desc: Format all Swift sources in place
    cmds:
      - swift format format --in-place --recursive Sources Tests Package.swift

  build:
    desc: Build a release binary
    cmds:
      - swift build -c release

  bundle:
    desc: Assemble build/Flick.app, stamp its version and sign it
    deps: [build]
    cmds:
      - rm -rf {{.APP}}
      - mkdir -p {{.APP}}/Contents/MacOS
      - cp support/Info.plist {{.APP}}/Contents/Info.plist
      - plutil -replace CFBundleShortVersionString -string "{{.VERSION}}" {{.APP}}/Contents/Info.plist
      - plutil -replace CFBundleVersion -string "{{.BUILD}}" {{.APP}}/Contents/Info.plist
      - cp "$(swift build -c release --show-bin-path)/Flick" {{.APP}}/Contents/MacOS/Flick
      - scripts/sign-app.sh {{.APP}}

  release-notes:
    desc: Print the release notes since the last tag (empty means nothing to release)
    cmds:
      - git-cliff --unreleased --strip all

  dmg:
    desc: Package build/Flick.app as build/Flick-<version>.dmg
    deps: [bundle]
    vars:
      STAGE: build/dmg
      DMG: build/Flick-{{.VERSION}}.dmg
    cmds:
      - rm -rf {{.STAGE}} {{.DMG}}
      - mkdir -p {{.STAGE}}
      - ditto {{.APP}} {{.STAGE}}/Flick.app
      - ln -s /Applications {{.STAGE}}/Applications
      - hdiutil create -volname Flick -srcfolder {{.STAGE}} -format UDZO -ov {{.DMG}}
      - hdiutil verify {{.DMG}}
      - rm -rf {{.STAGE}}

  release:
    desc: Test, build, check and publish a release on GitHub (DRY=1 stops before publishing)
    cmds:
      - DRY={{.DRY}} scripts/release.sh

  run:
    desc: Bundle and (re)start Flick
    deps: [bundle]
    cmds:
      - pkill -x Flick || true
      - open {{.APP}}
