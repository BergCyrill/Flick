repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict --quiet
        language: system
        types: [swift]
      - id: swift-format
        name: swift-format
        entry: swift format lint --strict
        language: system
        types: [swift]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        # direnv syntax, not a shell script
        exclude: ^\.envrc$
